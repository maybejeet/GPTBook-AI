services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: gptbook-ai
    environment:
      POSTGRES_DB: gptbook
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - gptbook_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gptbook"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  gptbook_pg_data: